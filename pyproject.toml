[project]
name = "stock-analysis"
version = "1.0.0"
description = "Single-user Windows desktop inventory analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "PySide6-Addons>=6.6.0",
    "SQLAlchemy>=2.0.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
stock-analysis = "stock_analysis.main:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_analysis = ["resources/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
